<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111827">Anatomia concettuale di un nodo WCM</text>
  <rect x="430" y="88" width="540" height="44" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="700" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3730a3">MODELLO PEDAGOGICO — NON SCHEMA OBBLIGATORIO</text><text x="700" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4b5563">Le proprietà possono variare in base al tipo e alla materialità del nodo</text>

  <circle cx="700" cy="500" r="275" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="700" cy="500" r="180" fill="#eef2ff" stroke="#a5b4fc" stroke-width="3"/>
  <circle cx="700" cy="500" r="100" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>

  <text x="700" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#312e81">CONTENUTO</text>
  <text x="700" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#312e81">/ STATO</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1f2937">
    <text x="700" y="290" text-anchor="middle">IDENTITÀ</text>
    <text x="895" y="390" text-anchor="middle">TIPO</text>
    <text x="855" y="610" text-anchor="middle">STATUS</text>
    <text x="545" y="610" text-anchor="middle">SCOPE</text>
    <text x="505" y="390" text-anchor="middle">AUTHORITY</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#374151">
    <text x="700" y="210" text-anchor="middle">PROVENANCE</text>
    <text x="1050" y="500" text-anchor="middle">RELAZIONI</text>
    <text x="700" y="805" text-anchor="middle">HISTORY / LINEAGE</text>
    <text x="350" y="500" text-anchor="middle">READ / USE CONDITIONS</text>
  </g>

  <line x1="700" y1="230" x2="700" y2="315" stroke="#94a3b8" stroke-width="2"/>
  <line x1="975" y1="500" x2="930" y2="500" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="780" x2="700" y2="680" stroke="#94a3b8" stroke-width="2"/>
  <line x1="425" y1="500" x2="470" y2="500" stroke="#94a3b8" stroke-width="2"/>

  <text x="700" y="865" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7280">Un nodo non è “qualcosa scritto da qualche parte”: è qualcosa che il sistema può riconoscere, qualificare e collegare.</text>
</svg>