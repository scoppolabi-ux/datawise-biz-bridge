<text x="1255" y="285" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1f2937">ATTORE / TASK</text>
<rect x="1140" y="350" width="230" height="72" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1255" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#065f46">WISE / AGENTE</text><text x="1255" y="406" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#047857">contesto task-scoped</text>
<rect x="1140" y="448" width="230" height="72" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1255" y="478" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#065f46">SERVICE LEAD</text><text x="1255" y="504" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#047857">route circoscritta</text>
<rect x="1140" y="546" width="230" height="72" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1255" y="576" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#065f46">UMANO</text><text x="1255" y="602" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#047857">orientamento rapido</text>
<rect x="1140" y="642" width="230" height="52" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1255" y="675" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#065f46">CONTESTO SUFFICIENTE</text>
<line x1="410" y1="480" x2="510" y2="480" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="460" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#334155">NAVIGA</text>
<line x1="990" y1="480" x2="1090" y2="480" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="1040" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#334155">RECUPERA</text>
<text x="750" y="845" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">Il layer non duplica la conoscenza e non crea authority.</text>
<text x="750" y="880" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#6b7280">Trasforma una memoria grande in un percorso di lettura progressivo, task-scoped e verificabile.</text>
</svg>