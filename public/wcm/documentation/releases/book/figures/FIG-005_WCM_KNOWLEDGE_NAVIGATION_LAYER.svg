<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930">
<rect width="1500" height="930" fill="#ffffff"/>
<text x="750" y="64" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#111827">WCM Knowledge Navigation Layer</text>
