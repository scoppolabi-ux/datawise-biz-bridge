<text x="750" y="240" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#312e81">KNOWLEDGE NAVIGATION LAYER</text>
<rect x="565" y="278" width="370" height="58" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2"/><text x="750" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#3730a3">1. ENTRY POINT</text>
<rect x="565" y="350" width="370" height="58" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2"/><text x="750" y="387" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#3730a3">2. INDEX / MAP</text>
<rect x="565" y="422" width="370" height="58" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2"/><text x="750" y="459" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#3730a3">3. METADATA</text>
<rect x="565" y="494" width="370" height="58" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2"/><text x="750" y="531" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#3730a3">4. SOURCE PRECEDENCE</text>
<rect x="565" y="566" width="370" height="58" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2"/><text x="750" y="603" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#3730a3">5. PROGRESSIVE RETRIEVAL</text>
<rect x="565" y="638" width="370" height="58" rx="14" fill="#ffffff" stroke="#818cf8" stroke-width="2"/><text x="750" y="675" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#3730a3">6. STOP CONDITION</text>
<text x="750" y="735" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#4338ca">indica dove andare, quanto scendere e quando fermarsi</text>
