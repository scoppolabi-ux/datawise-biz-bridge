<rect x="80" y="230" width="330" height="500" rx="26" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<text x="245" y="285" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1f2937">PERSISTENT</text>
<text x="245" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1f2937">ORGANIZATIONAL MEMORY</text>
<text x="245" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">decisioni</text>
<text x="245" y="408" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">processi / protocolli</text>
<text x="245" y="446" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">stato / runtime</text>
<text x="245" y="484" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">documenti / manuali</text>
<text x="245" y="522" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">evidence / learning</text>
<text x="245" y="560" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#475569">nodi / sinapsi</text>
<rect x="125" y="620" width="240" height="72" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="245" y="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#7c2d12">CONTIENE IL TERRITORIO</text>
<text x="245" y="677" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9a3412">non dice da solo cosa leggere ora</text>
