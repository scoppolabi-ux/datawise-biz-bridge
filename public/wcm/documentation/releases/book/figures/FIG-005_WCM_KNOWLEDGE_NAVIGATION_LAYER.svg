<text x="750" y="117" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#3730a3">LA MAPPA TRA MEMORIA PERSISTENTE E CONTESTO UTILE</text>
